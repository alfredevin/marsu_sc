<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>⚙️ Under Maintenance</title>
  <style>
    :root {
      --bg: #0f172a;
      /* slate-900 */
      --card: #111827;
      /* gray-900 */
      --muted: #94a3b8;
      /* slate-400 */
      --accent: #38bdf8;
      /* sky-400 */
      --accent-2: #a78bfa;
      /* violet-400 */
      --ok: #22c55e;
      /* green-500 */
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 50% -10%, #1f2937 0%, var(--bg) 60%);
      color: white;
    }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: min(980px, 100%);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .glow {
      position: absolute;
      inset: -40%;
      filter: blur(80px);
      opacity: .3;
      z-index: -1;
      background: conic-gradient(from 90deg at 50% 50%, var(--accent), transparent 20%, var(--accent-2), transparent 60%);
      animation: spin 20s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .header {
      display: grid;
      gap: .5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-flex;
      gap: .5rem;
      align-items: center;
      margin-inline: auto;
      padding: .35rem .7rem;
      border: 1px dashed rgba(148, 163, 184, .4);
      border-radius: .75rem;
      color: var(--muted);
      font-size: .85rem;
      letter-spacing: .02em;
    }

    .badge .dot {
      width: .5rem;
      height: .5rem;
      border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 12px var(--ok);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 5vw + .5rem, 5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #c7d2fe, #7dd3fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      color: var(--muted);
      font-size: clamp(1rem, 1.1vw + .2rem, 1.25rem);
    }

    .scene {
      margin: 1rem auto 2rem;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .stage {
      width: min(640px, 92%);
      aspect-ratio: 16/9;
      background: radial-gradient(800px 400px at 50% 0%, rgba(56, 189, 248, .08), transparent 60%),
        linear-gradient(180deg, rgba(167, 139, 250, .10), transparent 60%);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 1rem;
      position: relative;
      overflow: hidden;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26%;
      background:
        radial-gradient(600px 120px at 50% -10%, rgba(255, 255, 255, .05), transparent 40%),
        linear-gradient(180deg, rgba(2, 6, 23, .6), rgba(2, 6, 23, .85));
      border-top: 1px solid rgba(148, 163, 184, .2);
    }

    /* Cute mechanic character */
    .mechanic {
      position: absolute;
      left: 18%;
      bottom: 24%;
      width: 200px;
      transform-origin: 50% 100%;
      animation: floaty 4s ease-in-out infinite;
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    .gear {
      position: absolute;
      right: 14%;
      bottom: 30%;
      width: 120px;
      opacity: .9;
      animation: gearSpin 6s linear infinite;
    }

    @keyframes gearSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #fde047;
      box-shadow: 0 0 16px #fde047;
      opacity: 0;
    }

    .spark.a {
      left: 44%;
      bottom: 48%;
      animation: spark 1.6s infinite .2s;
    }

    .spark.b {
      left: 47%;
      bottom: 52%;
      animation: spark 1.6s infinite .6s;
    }

    .spark.c {
      left: 50%;
      bottom: 49%;
      animation: spark 1.6s infinite 1s;
    }

    @keyframes spark {
      0% {
        transform: scale(.2);
        opacity: 0
      }

      10% {
        opacity: 1
      }

      50% {
        transform: scale(1.2);
        opacity: .8
      }

      100% {
        transform: scale(0);
        opacity: 0
      }
    }

    .cable {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 42%;
      height: 6px;
      background: linear-gradient(90deg, #0ea5e9, #a78bfa);
      border-radius: 999px;
    }

    .cable:before,
    .cable:after {
      content: "";
      position: absolute;
      top: -10px;
      width: 18px;
      height: 26px;
      background: #0b1020;
      border: 1px solid rgba(148, 163, 184, .4);
      border-radius: 4px;
    }

    .cable:before {
      left: -2px;
    }

    .cable:after {
      right: -2px;
    }

    .break {
      position: absolute;
      left: 48.5%;
      bottom: calc(42% + 3px);
      width: 3%;
      height: 10px;
      background: #0b1020;
      transform: rotate(5deg);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .06) inset;
    }

    /* wrench hand tapping */
    .wrench {
      position: absolute;
      left: 52%;
      bottom: 33%;
      width: 90px;
      transform-origin: 10% 80%;
      animation: tap 1.2s ease-in-out infinite;
    }

    @keyframes tap {

      0%,
      100% {
        transform: rotate(-8deg) translateY(0)
      }

      50% {
        transform: rotate(8deg) translateY(-4px)
      }
    }

    /* blinking eyes */
    .eye {
      animation: blink 5s infinite;
      transform-origin: center;
    }

    @keyframes blink {

      0%,
      2%,
      60%,
      62%,
      100% {
        transform: scaleY(1)
      }

      1%,
      61% {
        transform: scaleY(0.05)
      }
    }

    .actions {
      display: flex;
      gap: .75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, .3);
      background: rgba(255, 255, 255, .04);
      color: white;
      padding: .8rem 1rem;
      border-radius: .85rem;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(148, 163, 184, .6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
    }

    .btn.primary {
      border-color: transparent;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .footer-note {
      text-align: center;
      margin-top: 1rem;
      color: var(--muted);
      font-size: .9rem
    }

    @media (max-width: 520px) {
      .mechanic {
        left: 8%;
        width: 150px;
      }

      .gear {
        right: 6%;
        width: 90px;
      }

      .wrench {
        left: 50%;
        width: 70px;
      }

      .break {
        left: 47%;
        width: 6%;
      }
    }
  </style>
</head>

<body>
  <main class="wrap" role="main">
    <section class="card" aria-label="Under Maintenance">
      <div class="glow" aria-hidden="true"></div>

      <div class="header">
        <div class="badge" aria-hidden="true"><span class="dot"></span> System Notice</div>
        <h1>⚙️ Under Maintenance</h1>
        <p class="sub">
          Pasensya na po, kasalukuyang ina-update at inaayos ang system. 🚧<br>
          Subukan muli mamaya o bumalik sa homepage.
        </p>
      </div>

      <div class="scene" aria-hidden="true">
        <div class="stage">
          <div class="cable"></div>
          <div class="break"></div>

          <!-- Same mechanic SVG -->
          <svg class="mechanic" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="110" cy="170" rx="56" ry="28" fill="#0b1020" stroke="rgba(148,163,184,.5)" />
            <rect x="70" y="90" width="80" height="70" rx="14" fill="#0b1020" stroke="rgba(148,163,184,.5)" />
            <circle cx="110" cy="70" r="42" fill="#0b1020" stroke="rgba(148,163,184,.6)" />
            <g class="eye">
              <circle cx="95" cy="70" r="6" fill="#38bdf8" />
              <circle cx="125" cy="70" r="6" fill="#38bdf8" />
            </g>
            <ellipse cx="85" cy="82" rx="7" ry="4" fill="#a78bfa" opacity=".6" />
            <ellipse cx="135" cy="82" rx="7" ry="4" fill="#a78bfa" opacity=".6" />
            <path d="M70 58c15-18 65-18 80 0v8H70z" fill="#111827" stroke="rgba(148,163,184,.5)" />
            <rect x="82" y="48" width="56" height="12" rx="6" fill="#38bdf8" opacity=".4" />
            <rect x="50" y="105" width="22" height="10" rx="5" fill="#0b1020" stroke="rgba(148,163,184,.5)" />
            <rect x="148" y="105" width="22" height="10" rx="5" fill="#0b1020" stroke="rgba(148,163,184,.5)" />
          </svg>

          <!-- wrench -->
          <svg class="wrench" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 34a10 10 0 1 1 8-17l6 6 18-6 8 8-6 18 6 6a10 10 0 1 1-17 8l-23-23z" fill="#cbd5e1" />
          </svg>

          <!-- gear -->
          <svg class="gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g fill="#1f2937" stroke="#94a3b8" stroke-width="2">
              <circle cx="50" cy="50" r="14" fill="#0b1020" />
              <path
                d="M50 6l8 6 10-2 3 10 9 4-2 10 7 7-7 7 2 10-9 4-3 10-10-2-8 6-8-6-10 2-3-10-9-4 2-10-7-7 7-7-2-10 9-4 3-10 10 2z" />
            </g>
          </svg>

          <!-- sparks -->
          <div class="spark a"></div>
          <div class="spark b"></div>
          <div class="spark c"></div>

          <div class="ground"></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" onclick="goHome()">Go Home</button>
        <button class="btn" onclick="window.location.reload()">Reload</button>
      </div>

      <p class="footer-note">Kung may urgent concern, pakikontak ang admin. Salamat sa iyong pasensya 💙</p>
    </section>
  </main>

  <script>
    function goHome() {
      const home = '/'; // change to your homepage route
      window.location.href = home;
    }
  </script>
</body>

</html>
