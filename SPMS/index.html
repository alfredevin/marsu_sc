<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MilkTea App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-bottom: 60px; /* Space for bottom nav */
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #fff;
      border-top: 1px solid #ddd;
      z-index: 999;
    }

    .bottom-nav .nav-link {
      color: #888;
      font-size: 14px;
    }

    .bottom-nav .nav-link.active {
      color: #5c2e91; /* highlight color */
    }

    .milktea-card img {
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-light bg-light shadow-sm sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">MilkTea House</span>
    </div>
  </nav>

  <!-- Body Content -->
  <div class="container mt-3 mb-5">
    <h5 class="mb-3">Best Sellers</h5>
    <div class="row row-cols-2 g-3">
      <div class="col">
        <div class="card milktea-card">
          <img src="https://via.placeholder.com/150" class="card-img-top" alt="Milk Tea">
          <div class="card-body p-2">
            <h6 class="card-title">Classic Milk Tea</h6>
            <p class="card-text text-muted small">₱80.00</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card milktea-card">
          <img src="https://via.placeholder.com/150" class="card-img-top" alt="Milk Tea">
          <div class="card-body p-2">
            <h6 class="card-title">Okinawa Milk Tea</h6>
            <p class="card-text text-muted small">₱90.00</p>
          </div>
        </div>
      </div>
      <!-- Add more drinks as needed -->
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="navbar bottom-nav d-flex justify-content-around border-top">
    <a class="nav-link active text-center" href="#">
      <i class="bi bi-house-door-fill"></i><br>
      <small>Home</small>
    </a>
    <a class="nav-link text-center" href="#">
      <i class="bi bi-receipt"></i><br>
      <small>Orders</small>
    </a>
    <a class="nav-link text-center" href="#">
      <i class="bi bi-person-circle"></i><br>
      <small>Profile</small>
    </a>
  </nav>

  <!-- Bootstrap JS and Icons -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
